name: CI

on:
  push:
    branches: [main, rewrite/go-v1]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ddivination

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e
