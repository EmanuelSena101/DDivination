name: CI

on:
  push:
    branches: [main, rewrite/go-v1]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - name: Verify OpenAPI and generated client
        shell: pwsh
        run: ./scripts/check-contract.ps1 -SkipInstall

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run check:bundle

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ddivination

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ddivination_test
          POSTGRES_USER: ddivination
          POSTGRES_PASSWORD: ddivination
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddivination -d ddivination_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ddivination:ddivination@127.0.0.1:5432/ddivination_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: go test ./...
      - run: go vet ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ddivination_e2e
          POSTGRES_USER: ddivination
          POSTGRES_PASSWORD: ddivination
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddivination -d ddivination_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ddivination:ddivination@127.0.0.1:5432/ddivination_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e

  developer-workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ddivination_dev
          POSTGRES_USER: ddivination
          POSTGRES_PASSWORD: ddivination
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddivination -d ddivination_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ddivination:ddivination@127.0.0.1:5432/ddivination_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - name: Start and stop the development environment
        shell: pwsh
        run: |
          try {
            .\scripts\dev.ps1 -SkipInstall
            Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8080/api/v1/health
            $embeddedFrontend = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8080
            if ($embeddedFrontend.Content -notmatch '<div id="root"></div>') {
              throw "The Go server did not serve the compiled frontend."
            }
            Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:5173
          } finally {
            .\scripts\stop.ps1
          }
      - name: Run the unified test command
        shell: pwsh
        run: .\scripts\test.ps1 -SkipE2E -SkipInstall
