[tool.poetry]
name = "ddivination"
version = "0.1.0"
description = "DDivination - A guided dungeon builder for D&D GMs"
authors = ["DDivination Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = {extras = ["standard"], version = "^0.115.0"}
uvicorn = "^0.30.0"
httpx = "^0.27.0"
networkx = "^3.2"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
