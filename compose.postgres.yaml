name: ddivination

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ddivination
      POSTGRES_USER: ddivination
      POSTGRES_PASSWORD: ddivination
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddivination -d ddivination"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ddivination-postgres:/var/lib/postgresql/data

volumes:
  ddivination-postgres:
